<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice Test — Golden Mind CBT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<main class="shell quiz-wrap">
  <!-- SETUP -->
  <section id="setup">
    <h1 style="font-size:2.4rem">Practice Test</h1>
    <p>Pick one or more topics. Questions come from the markdown files in the <code>questions</code> folder.</p>
    <div class="grid" id="topicList"><p class="muted">Loading topics… If nothing appears, refresh the page or <a href="index.html">return home</a>.</p></div>
    <noscript><p>This page needs JavaScript to load the questions. Please turn it on and refresh.</p></noscript>
    <div class="opts-row">
      <label>Mode<br />
        <select id="mode">
          <option value="practice">Practice: tips after each answer</option>
          <option value="exam">Exam: timed, like a real CBT</option>
        </select></label>
      <label>Questions<br />
        <select id="count"><option>5</option><option selected>10</option><option>20</option><option>40</option></select></label>
    </div>
    <button class="btn btn-primary" id="startBtn" type="button">Start test</button>
    <p class="lab-msg" id="setupMsg" role="alert"></p>
  </section>

  <!-- RUN -->
  <section id="run" class="hidden">
    <div class="exam-bar">
      <strong id="runTitle"></strong>
      <span id="qCount"></span>
      <span class="clock" id="clock" aria-label="Time left"></span>
    </div>
    <div class="q-card">
      <p class="q-text" id="qText"></p>
      <div id="qOpts" role="radiogroup" aria-labelledby="qText"></div>
      <div class="feedback hidden" id="fb" role="status"></div>
    </div>
    <div class="q-actions">
      <button class="btn btn-secondary" id="prev" type="button">Previous</button>
      <button class="btn btn-secondary" id="flag" type="button">Flag</button>
      <button class="btn btn-primary" id="next" type="button">Next</button>
      <button class="btn btn-secondary" id="submit" type="button">Submit test</button>
    </div>
    <div class="navgrid" id="navgrid" aria-label="Question navigator"></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden">
    <div class="card" style="text-align:center">
      <p id="resEmoji" style="font-size:3rem;margin:0"></p>
      <div class="score-big"><span id="resScore"></span></div>
      <h2 id="resMsg"></h2>
      <p id="resDetail"></p>
      <div class="lesson-actions" style="justify-content:center">
        <button class="btn btn-primary" id="again" type="button">Try again</button>
        <button class="btn btn-secondary" id="home" type="button">Choose topics</button>
        <button class="btn btn-secondary" id="print" type="button">Print result</button>
      </div>
    </div>
    <h2 style="margin-top:1.5rem">Review</h2>
    <div id="review"></div>
  </section>
</main>
<script src="js/markdown.js"></script><script src="js/icons.js"></script><script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/quiz.js"></script>
</body></html>
