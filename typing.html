<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Tutor — Golden Mind CBT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<main class="shell type-layout">
  <nav aria-label="Typing lessons"><div class="type-list" id="list"></div></nav>
  <section>
    <h1 id="tTitle" style="font-size:2.2rem">Typing Tutor</h1>
    <p id="tHelp"></p>
    <div class="stats" aria-live="off">
      <div class="stat"><b id="sWpm">0</b><small>words / min</small></div>
      <div class="stat"><b id="sAcc">100%</b><small>accuracy</small></div>
      <div class="stat"><b id="sTime">0s</b><small>time</small></div>
    </div>
    <div class="type-text" id="text" tabindex="0" aria-label="Typing text. Start typing to begin."></div>
    <div id="kb"></div>
    <p class="lab-msg" id="tMsg" role="status"></p>
    <div class="lesson-actions">
      <button class="btn btn-secondary" id="again" type="button">Restart</button>
      <button class="btn btn-primary" id="nextT" type="button" hidden>Next lesson</button>
    </div>
    <p style="color:#4a587c">Type exactly what you see. A wrong key won't move you on — find the glowing key. Use the correct finger for each colour.</p>
  </section>
</main>
<script src="js/markdown.js"></script><script src="js/icons.js"></script><script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/typing.js"></script>
</body></html>
