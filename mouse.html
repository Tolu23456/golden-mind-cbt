<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mouse Lab — Golden Mind CBT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<main class="shell lab">
  <nav class="lesson-nav" id="levels" aria-label="Mouse levels"></nav>
  <section>
    <h1 id="lvTitle" style="font-size:2.2rem">Mouse Lab</h1>
    <p id="lvHelp"></p>
    <div class="arena" id="arena"></div>
    <p class="lab-msg" id="msg" role="status"></p>
    <div class="meter" aria-hidden="true"><span id="bar"></span></div>
    <div class="lesson-actions">
      <button class="btn btn-secondary" id="restart" type="button">Restart level</button>
      <button class="btn btn-primary" id="nextLv" type="button" hidden>Next level</button>
    </div>
    <p class="hands-note" style="color:#4a587c">Tip: no mouse? A touchpad works too. Tap = click, two-finger tap = right-click, two-finger slide = scroll.</p>
  </section>
</main>
<script src="js/markdown.js"></script><script src="js/icons.js"></script><script src="js/data.js"></script><script src="js/app.js"></script>
<script src="js/mouse.js"></script>
</body></html>
